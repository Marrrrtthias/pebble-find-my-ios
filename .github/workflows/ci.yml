name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PEBBLE_TOOL_VERSION: "5.1.2"
  PEBBLE_SDK_VERSION: "4.44"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # JS tests (node --test).
      - name: Run tests
        run: npm test

  build:
    name: Build watchapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Pebble SDK runs webpack for the PebbleKit JS bundle.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      # pebble-tool creates oauth_firebase lazily from two threads on first
      # use and can crash with FileExistsError; creating it up front avoids
      # that race.
      - name: Install pebble-tool
        run: |
          uv tool install --python 3.13 "pebble-tool==${PEBBLE_TOOL_VERSION}"
          mkdir -p ~/.local/share/pebble-sdk/oauth_firebase

      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk/SDKs
          key: pebble-sdk-${{ env.PEBBLE_SDK_VERSION }}-tool-${{ env.PEBBLE_TOOL_VERSION }}

      # Checks the SDK directory rather than `pebble sdk list`, whose output
      # also lists SDKs that are only available for download.
      - name: Install Pebble SDK
        run: |
          if [ -d ~/.local/share/pebble-sdk/SDKs/"${PEBBLE_SDK_VERSION}" ]; then
            pebble sdk activate "${PEBBLE_SDK_VERSION}"
          else
            pebble sdk install "${PEBBLE_SDK_VERSION}" < /dev/null
          fi

      - name: Build all platforms
        run: pebble build

      # archive: false uploads the .pbw itself instead of a zip containing it.
      - name: Upload .pbw
        uses: actions/upload-artifact@v7
        with:
          path: build/*.pbw
          archive: false
          if-no-files-found: error
