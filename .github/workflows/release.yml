name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PEBBLE_TOOL_VERSION: "5.1.2"
  PEBBLE_SDK_VERSION: "4.44"

jobs:
  release:
    name: Build and publish .pbw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      # The tag must match the version in package.json (v2.0.0 <-> 2.0.0).
      - name: Check release version and changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          node .github/scripts/release-notes.js > /dev/null

      - uses: astral-sh/setup-uv@v6

      - name: Install pebble-tool
        run: |
          uv tool install --python 3.13 "pebble-tool==${PEBBLE_TOOL_VERSION}"
          mkdir -p ~/.local/share/pebble-sdk/oauth_firebase

      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk/SDKs
          key: pebble-sdk-${{ env.PEBBLE_SDK_VERSION }}-tool-${{ env.PEBBLE_TOOL_VERSION }}

      - name: Install Pebble SDK
        run: |
          if [ -d ~/.local/share/pebble-sdk/SDKs/"${PEBBLE_SDK_VERSION}" ]; then
            pebble sdk activate "${PEBBLE_SDK_VERSION}"
          else
            pebble sdk install "${PEBBLE_SDK_VERSION}" < /dev/null
          fi

      - name: Build all platforms
        run: pebble build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/*.pbw \
            --title "Find Phone ${GITHUB_REF_NAME}" \
            --generate-notes
